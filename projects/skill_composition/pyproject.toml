[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "huitu-skillcomp"
version = "0.1.0"
description = "Baseline-first robot skill composition experiments on a single ManiSkill scene"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "torch>=2.1",
  "gymnasium>=1.0",
  "mani_skill>=3.0,<4",
  "h5py>=3.8",
]
[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
